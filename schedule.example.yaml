# Default day templates. Copy to schedule.yaml (or just save from Settings ->
# Day templates, which writes schedule.yaml for you) and edit.
# Today renders these as an ordered goal list, not a timetable: `start` is only
# the sort key, `min` is the goal's size and drives the weekly hour budget.
# Blocks whose category belongs to a disabled module (gym = health, bridge =
# side, clips = clips) are skipped until that module is switched on.
