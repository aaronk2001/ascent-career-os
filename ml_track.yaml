track: ml-fundamentals
title: Computer Vision → ML/LLM Foundations
started: 2026-05-08
target_completion: 2026-09-04
spine: "OpenCV University + Ultralytics + SAM 2 (weeks 1–6, active); Karpathy — Neural Networks: Zero to Hero + HF stack (weeks 7–18, parked until CV ships)"
sandbox_repo: ~/projects/ml-sandbox
cadence:
  sessions_per_week: 2
  days: [Tue, Thu]
  hours_per_session: 1
  rest_day: Sun
  flex_day: Sat
  note: "Long-game — secondary track. ~17 cal weeks for 6 active CV weeks. LLM weeks 7–18 stay parked."
references:
  - label: OpenCV University — Free CV Crash Course
    role: CV spine (weeks 1–2)
    url: https://opencv.org/university/free-courses/
  - label: PyImageSearch — Deep Learning for CV
    role: CV practitioner reference
    url: https://pyimagesearch.com/deep-learning-computer-vision-python-book/
  - label: Ultralytics YOLO docs
    role: detection + tracking (week 4)
    url: https://docs.ultralytics.com/
  - label: Meta SAM 2
    role: segmentation (week 5)
    url: https://github.com/facebookresearch/sam2
  - label: Roboflow Universe
    role: CV datasets + auto-label
    url: https://universe.roboflow.com/
  - label: Karpathy Zero-to-Hero
    role: LLM spine (parked, weeks 7–12)
    url: https://karpathy.ai/zero-to-hero.html
  - label: huggingface/ml-intern
    role: real-world reference codebase (parked)
    url: https://github.com/huggingface/ml-intern
  - label: HF LLM Course
    role: modern HF stack vocabulary (parked)
    url: https://huggingface.co/learn/llm-course/chapter1/1
  - label: Géron — Hands-On ML
    role: breadth + classical ML reference (parked)
    url: https://www.oreilly.com/library/view/hands-on-machine-learning/9798341607972/
  - label: ashishpatel26/500
    role: project-archetype bank (parked)
    url: https://github.com/ashishpatel26/500-AI-Machine-learning-Deep-learning-Computer-vision-NLP-Projects-with-code
weeks:
  # ── ACTIVE: Computer Vision arc (weeks 1–6) ──
  - id: 1
    title: OpenCV Foundations — Image I/O, Color, Transforms
    status: not_started
    started_at: null
    completed_at: null
    objective: >-
      Stand up the OpenCV toolchain and develop intuition for what a digital image
      actually is. Build muscle memory for I/O, color spaces, geometric transforms,
      and the core filters you reach for before any deep learning enters the picture.
    vocab: [BGR vs RGB, HSV, grayscale, channel, kernel, convolution, Gaussian blur, Canny, threshold, ROI, affine warp, histogram equalization, gamma]
    primary_resource:
      label: OpenCV University — Free CV Crash Course
      url: https://opencv.org/university/free-courses/
    sandbox_path: notebooks/cv_week01_opencv_foundations.ipynb
    ml_intern_angle: Skim huggingface/transformers vision-pipeline modules — note where image preprocessing happens vs where inference runs.
    can_explain:
      - Why OpenCV defaults to BGR and what breaks if you forget.
      - When HSV beats RGB for thresholding and color masking.
      - What a 3x3 Gaussian kernel does mathematically and visually.
      - Why Canny needs two thresholds and how hysteresis works.

  - id: 2
    title: Classical CV — Features, Geometry, Tracking
    status: not_started
    started_at: null
    completed_at: null
    objective: >-
      Cover the pre-deep-learning stack engineers still ship in production —
      keypoints, homography, contours, calibration, optical flow. These are the
      tools you reach for when "just train a model" is overkill or impossible.
    vocab: [SIFT, ORB, FAST, BRIEF, RANSAC, homography, fundamental matrix, contour, moments, camera intrinsics, distortion, optical flow, Lucas-Kanade, Kalman filter]
    primary_resource:
      label: OpenCV docs — Feature Detection & Camera Calibration
      url: https://docs.opencv.org/4.x/d7/d8b/tutorial_py_lucas_kanade.html
    sandbox_path: notebooks/cv_week02_classical_cv.ipynb
    ml_intern_angle: Read the eval-harness IO layer — how does the codebase load and version image-like data on disk?
    can_explain:
      - Difference between SIFT, ORB, and modern learned features (SuperPoint).
      - What a homography is and the minimum correspondences to estimate one.
      - Why camera calibration matters before you do any 3D reasoning.
      - When Kalman beats raw optical flow for object tracking.

  - id: 3
    title: CNNs From Scratch — LeNet → ResNet on CIFAR-10
    status: not_started
    started_at: null
    completed_at: null
    objective: >-
      Build the canonical CNN ladder in PyTorch — LeNet, VGG-style, ResNet —
      train on CIFAR-10, watch what each architectural change actually buys you.
      This is where vision-native models start.
    vocab: [convolution layer, stride, padding, pooling, receptive field, feature map, batch norm, residual block, skip connection, dropout, data augmentation, transfer learning]
    primary_resource:
      label: PyTorch — CIFAR-10 tutorial + ResNet paper
      url: https://pytorch.org/tutorials/beginner/blitz/cifar10_tutorial.html
    sandbox_path: notebooks/cv_week03_cnns_cifar.ipynb
    ml_intern_angle: Read torchvision.models — how do they version pretrained weights and where do checkpoints live on disk?
    can_explain:
      - Why convolutions are translation-equivariant and what that buys you.
      - How residual connections fix the degradation problem in deep nets.
      - Why batch norm sometimes hurts CV training (small batches, distribution shift).
      - Difference between feature extraction and full fine-tuning for transfer learning.

  - id: 4
    title: Object Detection — YOLO11/YOLOv8 + Custom Dataset
    status: not_started
    started_at: null
    completed_at: null
    objective: >-
      Train a real detector on your own data. Use Ultralytics YOLO end-to-end —
      data prep, training, validation, ONNX export. Run inference on a webcam
      stream and measure latency on this laptop's CPU vs the Pi cluster.
    vocab: [bounding box, IoU, NMS, mAP, anchor box, YOLO grid, COCO format, Roboflow, ONNX, TensorRT, FP16, edge inference]
    primary_resource:
      label: Ultralytics YOLO docs — Train Custom Data
      url: https://docs.ultralytics.com/modes/train/
    sandbox_path: notebooks/cv_week04_yolo_custom.ipynb
    ml_intern_angle: Compare Ultralytics CLI ergonomics to ml-intern's training-runner — which abstractions did each team pick and why?
    can_explain:
      - What mAP@0.5 vs mAP@0.5:0.95 measure and which to trust.
      - How NMS resolves overlapping detections and where it fails.
      - Why YOLO's grid + anchor scheme is faster than two-stage detectors.
      - Tradeoffs of ONNX vs native PyTorch for edge deployment.

  - id: 5
    title: Segmentation — SAM 2 + Mask R-CNN
    status: not_started
    started_at: null
    completed_at: null
    objective: >-
      Move from boxes to pixels. Run Meta's SAM 2 zero-shot, then fine-tune
      Mask R-CNN on a custom segmentation set. Build a video segmentation demo
      using SAM 2's tracking ability — single-click → mask propagated through frames.
    vocab: [semantic segmentation, instance segmentation, panoptic, mask, IoU per-pixel, prompt encoder, mask decoder, video object segmentation, dice loss, focal loss]
    primary_resource:
      label: Meta SAM 2 — Repo + Demo
      url: https://github.com/facebookresearch/sam2
    sandbox_path: notebooks/cv_week05_segmentation.ipynb
    ml_intern_angle: Read SAM 2's video-object-segmentation pipeline — how does state propagate across frames and where does it break?
    can_explain:
      - Difference between semantic, instance, and panoptic segmentation.
      - What SAM 2 added over SAM 1 and why video changes the architecture.
      - When dice loss beats cross-entropy for segmentation.
      - Why segmentation labels are 100x more expensive than detection labels.

  - id: 6
    title: CV Capstone — Real-Time Pipeline + Portfolio Demo
    status: not_started
    started_at: null
    completed_at: null
    objective: >-
      Ship a real-time CV pipeline — webcam in, detect + track + segment, overlay
      the results, export a 60-second portfolio video. Deploy the inference loop
      on the Pi cluster (pi-ai node) and document the latency budget end to end.
    vocab: [real-time inference, FPS budget, frame buffer, tracker (ByteTrack/BoT-SORT), webcam capture, GStreamer, edge deployment, model quantization, INT8, portfolio polish]
    primary_resource:
      label: Ultralytics — Object Tracking Guide
      url: https://docs.ultralytics.com/modes/track/
    sandbox_path: notebooks/cv_week06_cv_capstone.md
    ml_intern_angle: "Final CV pass — what one thing in your pipeline would you redesign if this were a 6-month team project instead of a 6-week solo build?"
    can_explain:
      - Pitch the CV capstone to a hiring manager in 60 seconds.
      - One latency tradeoff you made (model size vs FPS vs accuracy).
      - Why the Pi cluster is or isn't a good fit for this workload.
      - What you would automate (data labeling, retraining, eval) given another month.

  # ── PARKED: LLM / Karpathy Zero-to-Hero (weeks 7–18, resume after CV ships) ──
