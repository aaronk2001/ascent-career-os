  - id: 6
    scene: "— real hardware: Opta #1 (OpenPLC) + PMC over Modbus TCP"
    title: "Hardware Bridge — Sim to Real (CODESYS Master → Opta + Wireshark Proof)"
    related_skills: ["PLC Programming", "Serial Protocols", "SCADA/HMI"]
    related_nodes: ["ctl-ladder", "emb-comms", "ctl-scada"]
    status: not_started
    started_at: null
    completed_at: null
    objective: >-
      Bridge simulation and real hardware. Configure CODESYS as a Modbus TCP **master** (not
      slave) and have it read/write Opta #1 running OpenPLC as a Modbus TCP **server**. Toggle
      a real relay on the Opta from the PC CODESYS master. Capture Modbus TCP frames in Wireshark
      to prove end-to-end communication. Repeat with PMC as a second node on the network.
      Write a narrative ("Same Logic, Sim vs Real") showing how the CODESYS code stays identical,
      only the I/O target changes (Factory IO vs real hardware). This is the final interview story:
      the simulation-to-production pipeline.
    vocab:
      - Modbus TCP master (client)
      - Modbus TCP server (slave)
      - Function Code (FC 1, 3, 5, 15)
      - node (Opta, PMC, master PC)
      - coil (digital output)
      - register (analog)
      - MBAP (Modbus Application Protocol header)
      - Wireshark
      - packet capture
      - frame dissection
      - network topology
    primary_resource:
      label: CODESYS Modbus TCP Master / Slave Device Configuration + Wireshark Packet Analysis
      url: https://help.codesys.com/
    lab_path: plc-factoryio-codesys/week06-hw-bridge
    can_explain:
      - How Modbus TCP frames work — Function Code 5 vs 15, what a coil vs register holds.
      - Why using the same logic for sim and real hardware is a scaling win.
      - How to read a Wireshark capture and spot Modbus TCP traffic.
      - The role of node IDs, port 502, and network topology in Modbus TCP.
      - What changes when you swap Factory IO for real Optas (nothing in logic, everything in I/O config).
    deliverables:
      - "[40m] OpenPLC Runtime flashed to Opta #1 and its web UI loads from the PC browser at the Opta IP."
      - "[35m] Opta #1 given a static IP on the lab subnet and reachable by ping with 0% loss over 20 packets."
      - "[40m] OpenPLC program loaded exposing 8 DI, 8 coils and 4 holding registers; the Modbus tab lists all 20 addresses."
      - "[30m] OpenPLC confirmed listening on port 502 - netstat or a Modbus poll tool connects successfully."
      - "[45m] CODESYS Modbus TCP MASTER (not Slave) added pointing at the Opta #1 IP; the device goes green online."
      - "[40m] FC 1 channel configured to read coils - Opta input states appear as live CODESYS variables."
      - "[40m] FC 5 channel configured to write a single coil - writing TRUE from CODESYS audibly energises a real relay."
      - "[35m] FC 3 channel added reading 4 holding registers; values change in CODESYS when changed on the Opta."
      - "[40m] FC 15 channel added writing multiple coils in one transaction - all 8 relays set from a single write."
      - "[35m] Comms-loss behaviour verified: unplugging the Ethernet cable faults the master and drops outputs safely."
      - "[40m] Wireshark capture running on the lab interface with display filter modbus, and traffic visible."
      - "[40m] Capture saved as a .pcap file containing at least one FC 5 and one FC 15 transaction."
      - "[40m] One Modbus frame dissected in Wireshark and annotated: MBAP header fields, unit id, function code, payload."
      - "[40m] PMC added as a second Modbus TCP node polled by the same master, or hardware-unavailable documented with the reason."
