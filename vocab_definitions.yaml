# Glossary for Learning-track vocab terms (controls + ML/CV). term: one-line definition.
"4-20 mA": "Analog current-loop signal: 4 mA = 0%, 20 mA = 100%; immune to voltage drop over long wire runs."
"AUROC": "Area under the ROC curve; threshold-free binary-classifier quality (0.5 = chance, 1.0 = perfect)."
"AutoModel": "Hugging Face class that loads the correct model architecture from a checkpoint name."
"AutoTokenizer": "HF class that loads the tokenizer matching a given model."
"BGR vs RGB": "Channel-order difference: OpenCV uses BGR, most other libraries use RGB."
"BRIEF": "Binary feature descriptor built from pixel-intensity comparison pairs; fast to match."
"COCO format": "Common JSON annotation schema for object-detection and segmentation datasets."
"CTD": "Count-Down counter instruction; decrements on each rising edge."
"CTU": "Count-Up counter; increments on a rising edge and sets its done bit at the preset."
"Canny": "Multi-stage edge detector: gradient, non-max suppression, then hysteresis thresholding."
"Cyclic task": "A PLC/OpenPLC task that runs its logic at a fixed time interval."
"Dataset": "An object that yields individual training samples; abstraction over your raw data."
"E-stop interlock": "Safety wiring placing an emergency-stop in series so software can't bypass it."
"EtherNet/IP": "Industrial Ethernet protocol (CIP over TCP/UDP) used heavily by Allen-Bradley."
"F1": "Harmonic mean of precision and recall."
"FAST": "Features from Accelerated Segment Test — a very fast corner detector."
"FC 1": "Modbus Function Code 1: Read Coils."
"FC 15": "Modbus Function Code 15: Write Multiple Coils."
"FC 5": "Modbus Function Code 5: Write Single Coil."
"FP16": "16-bit half-precision float; halves memory and bandwidth versus FP32."
"FPS budget": "Target frames-per-second that bounds how long each inference may take."
"Function Code": "The byte in a Modbus request specifying the operation (read/write coils or registers)."
"GPU vs CPU": "GPUs do massively parallel matrix math (great for nets); CPUs handle serial logic."
"GStreamer": "Pipeline-based multimedia framework for capturing and processing video streams."
"Gaussian blur": "Smoothing by convolving with a Gaussian kernel; reduces noise and fine detail."
"Grafcet": "Graphical step-and-transition language for sequential control; basis of SFC."
"HSV": "Hue-Saturation-Value color space; often easier than RGB for color thresholding."
"I/O image": "A memory copy of inputs/outputs read and written once per scan for deterministic logic."
"IEC 61131-3": "The standard defining PLC languages: LD, ST, FBD, SFC, IL."
"INITIAL_STEP": "The starting step of an SFC sequence, active at power-up."
"INT8": "8-bit integer quantization; ~4x smaller/faster than FP32 with minor accuracy loss."
"IoU": "Intersection-over-Union; overlap between a predicted and a true box or mask."
"IoU per-pixel": "IoU computed over mask pixels (segmentation) rather than bounding boxes."
"KV cache": "Stored key/value tensors letting a transformer generate tokens without recomputing the past."
"Kalman filter": "Recursive estimator fusing noisy measurements with a motion model; common in tracking."
"LoRA": "Low-Rank Adaptation: fine-tune by training small added low-rank matrices while freezing the base."
"Lucas-Kanade": "Classic sparse optical-flow method assuming small, locally constant motion."
"MBAP header": "Modbus-TCP application header (transaction/protocol/length/unit IDs) prefixing the request."
"Modbus TCP": "Simple register/coil read-write protocol over TCP/IP, default port 502."
"NMS": "Non-Max Suppression: drops overlapping duplicate detections, keeping the highest score."
"ONNX": "Open model-exchange format for running networks across frameworks and runtimes."
"ORB": "Oriented FAST + rotated BRIEF — a fast, license-free detector/descriptor."
"OTE": "Output Energize — ladder instruction that turns a coil on when its rung is true."
"OpenPLC Runtime": "Open-source IEC 61131-3 runtime that executes compiled PLC programs."
"POU": "Program Organization Unit — a program, function, or function block in IEC 61131-3."
"PEFT": "Parameter-Efficient Fine-Tuning — methods (like LoRA) that train only a few parameters."
"RANSAC": "Robust fit that ignores outliers by repeatedly sampling minimal inlier sets."
"ROI": "Region Of Interest — a sub-area of an image you crop or process."
"Roboflow": "Platform for labeling, augmenting, and exporting computer-vision datasets."
"SCL": "Structured Control Language — Siemens' dialect of Structured Text."
"SFC": "Sequential Function Chart — the IEC 61131-3 language of steps and transitions."
"STEP": "An SFC stage representing a state; its actions run while the step is active."
"Structured Text": "High-level, Pascal-like IEC 61131-3 PLC programming language."
"TOF": "Timer Off-Delay — output stays on for a preset time after the input goes false."
"TON": "Timer On-Delay — output turns on after the input stays true for the preset time."
"TP": "Pulse Timer — output pulses on for a fixed preset duration when triggered."
"TRANSITION": "The condition between two SFC steps that advances the sequence when true."
"TensorRT": "NVIDIA library that optimizes and quantizes networks for fast GPU inference."
"Trainer": "Hugging Face high-level training loop handling optimization, logging, and checkpoints."
"TrainingArguments": "HF config object holding hyperparameters and options for the Trainer."
"Wireshark": "Packet capture/analysis tool; used to inspect Modbus or EtherNet/IP traffic."
"XIC": "Examine If Closed — a ladder contact true when its bit is 1 (normally open)."
"YOLO grid": "YOLO splits the image into a grid; each cell predicts boxes and classes."
"ablation": "An experiment that removes a component to measure its contribution."
"accuracy": "Fraction of predictions that are correct."
"action qualifier": "SFC code (N, S, R, P…) defining how and when a step's action runs."
"activation function": "A nonlinearity (ReLU, tanh…) on a layer's output that lets nets model complex functions."
"affine warp": "A linear image transform (rotate/scale/shear/translate) that keeps straight lines straight."
"agent loop": "Cycle of LLM plans, calls a tool, observes the result, then repeats until done."
"anchor box": "Preset box shapes a detector refines to predict objects."
"attention": "Mechanism letting a model weight which inputs matter for each output."
"autograd": "Automatic differentiation that records operations to compute gradients."
"backward pass": "Propagating gradients from the loss back through the network."
"baseline": "A reference model or score to compare improvements against."
"batch norm": "Normalizes activations per mini-batch to stabilize and speed training."
"benchmark": "A standard task/dataset used to compare models."
"bounding box": "A rectangle (x, y, w, h) localizing an object."
"camera intrinsics": "A camera's internal parameters (focal length, principal point) mapping 3D to pixels."
"causal mask": "An attention mask preventing a token from seeing future tokens."
"chain rule": "The calculus rule backprop uses to compose gradients through layers."
"channel": "One depth slice of an image/tensor (e.g. the R, G, or B plane)."
"checkpoint": "A saved snapshot of model weights and training state."
"checkpoint resume": "Continuing training from a saved checkpoint."
"coil": "A ladder output element representing a bit/output driven by its rung."
"collator": "A function that batches and pads samples into model-ready tensors."
"computation graph": "The graph of operations connecting inputs to outputs, used for autodiff."
"contamination": "Train/test leakage where test information influences training."
"context length": "The maximum number of tokens a model can attend to at once."
"contour": "A connected curve tracing an object's boundary in an image."
"convolution": "Sliding a kernel over an input to produce feature maps."
"convolution layer": "A network layer applying learnable convolution kernels."
"cross-entropy loss": "Classification loss measuring divergence between predicted and true distributions."
"data augmentation": "Synthetically transforming data (flip/crop/color) to improve generalization."
"dataloader": "Iterates a Dataset in shuffled, parallel-loaded batches."
"dice loss": "Segmentation loss based on overlap (1 minus the Dice coefficient)."
"distillation": "Training a small student model to mimic a larger teacher."
"distortion": "Lens-induced image warping (barrel/pincushion) corrected via calibration."
"distributed control": "Control architecture spreading logic across networked controllers/nodes."
"dropout": "Randomly zeroing activations during training to reduce overfitting."
"edge deployment": "Running models on local/embedded hardware instead of the cloud."
"edge inference": "Running inference on-device, at the data source."
"embedding": "A dense vector representing a token or item in a learned space."
"epoch": "One full pass over the training dataset."
"executor": "The component that runs a planned action or tool in an agent system."
"feature map": "The output activations of a conv layer (its detected features)."
"filter": "A convolution kernel — a set of weights detecting a pattern."
"fine-tuning": "Continuing to train a pretrained model on your own task/data."
"focal loss": "Classification loss that down-weights easy examples to focus on hard ones."
"forward pass": "Computing outputs from inputs through the network."
"frame buffer": "Memory holding the current video/image frame."
"fundamental matrix": "A 3x3 matrix relating corresponding points between two uncalibrated camera views."
"gamma": "A nonlinear brightness-correction exponent applied to pixel values."
"gradient": "Vector of the loss's derivatives w.r.t. parameters; points uphill in loss."
"gradient accumulation": "Summing gradients over several mini-batches to simulate a larger batch."
"grayscale": "A single-channel intensity image with no color."
"held-out set": "Data withheld from training to evaluate generalization."
"hidden layer": "A network layer between the input and the output."
"histogram equalization": "Contrast enhancement that spreads pixel intensities more evenly."
"homography": "A 3x3 projective transform mapping points on one plane to another."
"inference latency": "Time taken to produce one prediction."
"init scheme": "A method for setting initial weights (Xavier, He, etc.)."
"instance segmentation": "Labeling each object instance with its own pixel mask."
"kernel": "The small weight matrix slid in convolution (also: a GPU compute routine)."
"ladder logic": "A graphical PLC language drawn as relay-style rungs of contacts and coils."
"latch": "Logic that holds a state on until it is explicitly reset."
"layer norm": "Normalizes activations across features per sample; standard in transformers."
"leakage": "Train/test information bleed that inflates evaluation scores."
"learning rate": "The step size for weight updates during optimization."
"loss function": "A scalar measuring prediction error that training minimizes."
"mAP": "mean Average Precision — detection accuracy averaged over classes and IoU thresholds."
"map": "Applying a function to every item of a dataset (e.g. tokenization)."
"mask": "A per-pixel selection marking an object's region (segmentation)."
"mask decoder": "The SAM component turning prompts and image embeddings into masks."
"memory": "Stored past context/state an agent can recall."
"minibatch": "A small subset of samples processed per training step."
"mixed precision": "Training with an FP16/FP32 mix for speed and memory with stable accuracy."
"model card": "A document describing a model's intended use, data, and limitations."
"model quantization": "Reducing weight precision (e.g. to INT8) to shrink and speed up a model."
"moments": "Image statistics (area, centroid) computed from a contour's pixels."
"multi-head": "Running several attention heads in parallel to capture different relations."
"one-hot encoding": "Representing a category as a vector with a single 1 and the rest 0."
"optical flow": "The per-pixel motion field between consecutive frames."
"optimizer": "The algorithm (SGD, Adam…) that updates weights from gradients."
"overfitting": "When a model memorizes training data and generalizes poorly."
"padding": "Adding border pixels or tokens so sizes line up (conv or sequences)."
"panoptic": "Segmentation unifying semantic 'stuff' and instance 'things'."
"parameter": "A learnable weight or bias in the model."
"parameter count": "The total number of learnable weights — the model's size."
"perplexity": "A language-model quality metric: exp of the average loss (lower is better)."
"pipeline": "Chained processing stages (data to model to output); also HF's inference wrapper."
"planner": "The agent component that decides the sequence of actions."
"pooling": "Downsampling feature maps (max/avg) to shrink spatial size."
"port 502": "The default TCP port for Modbus TCP."
"portfolio polish": "Refining demos and repos into recruiter-ready portfolio pieces."
"positional encoding": "A signal added to tokens so a transformer knows their order."
"precision/recall": "Precision = correct of predicted positives; recall = found of actual positives."
"pretraining": "Initial large-scale training before task-specific fine-tuning."
"prompt encoder": "The SAM module encoding user prompts (points/boxes) for segmentation."
"quantization": "Reducing the numeric precision of weights/activations."
"rank": "In LoRA, the low-rank dimension of the adapter matrices (also: a matrix's rank)."
"real-time inference": "Producing predictions fast enough for live use."
"receptive field": "The input region that influences one output activation."
"reproducibility": "Getting identical results via fixed seeds and configs."
"residual block": "A block that adds its input to its output, easing deep-net training."
"residual connection": "A shortcut adding a layer's input to its output."
"reward signal": "Scalar feedback guiding reinforcement-learning or agent behavior."
"rollout": "Running a policy or agent forward to collect a trajectory."
"rung": "One horizontal line of ladder logic: its conditions drive its outputs."
"sampling": "Drawing outputs from a probability distribution (e.g. token sampling)."
"scalar/vector/matrix": "0-D, 1-D, and 2-D tensors respectively."
"scan cycle": "The PLC's repeating loop: read inputs, solve logic, write outputs."
"seal-in": "A rung where the output's own contact keeps it energized after the start button releases."
"selective divergence": "An SFC OR-branch: one path is taken based on which transition fires."
"self-attention": "Attention relating tokens within the same sequence."
"semantic segmentation": "Labeling every pixel with a class, without separating instances."
"serving": "Deploying a model behind an API for inference."
"shape": "The dimensions of a tensor."
"shuffle": "Randomizing sample order each epoch."
"simultaneous divergence": "An SFC AND-branch: parallel paths activate together."
"skip connection": "A shortcut passing activations past layers to help gradients flow."
"slave ID": "The Modbus unit/device address identifying the target on a bus."
"softmax": "Turns logits into a probability distribution that sums to 1."
"split": "A partition of data (train/validation/test)."
"streaming": "Processing data or tokens incrementally as they arrive."
"stride": "The step size a kernel or window moves across the input."
"tanh/ReLU": "Common activations: tanh squashes to -1..1; ReLU zeros negatives."
"temperature": "A sampling knob; higher values make outputs more random."
"tensor": "A multi-dimensional numeric array — the core deep-learning data type."
"threshold": "A cutoff turning scores or pixels into binary decisions."
"token": "A unit (often a subword) that a language model processes."
"tool": "An external function an agent can call."
"tracker (ByteTrack/BoT-SORT)": "An algorithm linking detections across frames into persistent object tracks."
"trajectory": "A sequence of states/actions over time (agent or tracking)."
"transfer learning": "Reusing a pretrained model's knowledge on a new task."
"video object segmentation": "Tracking and masking objects across the frames of a video."
"vocabulary": "The set of tokens a model or tokenizer knows."
"watchdog scan time": "The maximum allowed scan duration; exceeding it faults the PLC as a safety check."
"webcam capture": "Grabbing frames from a webcam for processing."
"holding register": "A Modbus 16-bit read/write register (function codes 3/6/16) holding analog setpoints and process values; addressed in the 4xxxx range."
"SIFT": "Scale-Invariant Feature Transform: detects and describes local image keypoints that stay stable under scale, rotation, and lighting changes."
